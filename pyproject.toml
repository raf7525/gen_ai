[project]
name = "cinedata-agent"
version = "0.1.0"
description = "Agente Text-to-SQL (arquitetura inspirada no CHESS) sobre a camada Gold da CineData"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-openai>=0.3",
    "sqlglot>=26.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "rich>=13.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tabulate>=0.9",
]

[project.scripts]
cinedata = "cinedata_agent.perguntar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cinedata_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
