  categoria: Fora do escopo
  tipo: fora_do_escopo
  pergunta: Qual é a capital da França?

- id: O2
  categoria: Fora do escopo
  tipo: fora_do_escopo
  pergunta: Me passa uma receita de bolo de cenoura

