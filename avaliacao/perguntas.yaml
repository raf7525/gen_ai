# Conjunto de avaliação: as 14 perguntas de exemplo do enunciado + 2 próprias,
# 2 fora do escopo e 1 tentativa de injeção. Cada pergunta de dados tem um SQL ouro.
#
# comparar.colunas: colunas do SQL ouro conferidas no resultado do agente (nomes podem mudar:
#   a comparação é pelos valores; texto sem diferença de maiúsculas, números com 1% de tolerância).
# comparar.k: quantas linhas do SQL ouro conferir (0 = todas).
# comparar.modo: "linhas" (padrão) ou "metrica" (só os valores da 1ª coluna, para rankings
#   com empates, em que os nomes podem variar).

- id: F1
  categoria: Bilheteria e finanças
  pergunta: Top 10 filmes com maior receita em R$
  sql_ouro: |-
    SELECT d.titulo, d.ano_lancamento, ROUND(f.receita_brl, 2) AS receita_brl
    FROM fact_movies_performance f
    JOIN dim_movies d ON d.sk_movie_id = f.sk_movie_id
    WHERE f.receita_brl IS NOT NULL
    ORDER BY f.receita_brl DESC
    LIMIT 10
  comparar: {colunas: [titulo, receita_brl], k: 10}

- id: F2
  categoria: Bilheteria e finanças
  pergunta: Lucro médio por gênero, considerando apenas filmes com receita informada
  sql_ouro: |-
    SELECT g.nome_genero, COUNT(*) AS filmes, ROUND(AVG(f.lucro_brl), 2) AS lucro_medio_brl
    FROM fact_movies_performance f
    JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
    JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
    WHERE f.receita_brl IS NOT NULL
    GROUP BY g.nome_genero
    ORDER BY lucro_medio_brl DESC
  comparar: {colunas: [nome_genero, lucro_medio_brl], k: 5}

- id: F3
  categoria: Bilheteria e finanças
  pergunta: Filmes com maior margem de lucro, entre os que possuem receita e orçamento informados
  sql_ouro: |-
    SELECT d.titulo, d.ano_lancamento, ROUND(100.0 * f.lucro_brl / f.receita_brl, 2) AS margem_pct
    FROM fact_movies_performance f
    JOIN dim_movies d ON d.sk_movie_id = f.sk_movie_id
    WHERE f.receita_brl >= 10000 AND f.orcamento_brl >= 10000
    ORDER BY margem_pct DESC
    LIMIT 10
  comparar: {colunas: [titulo, margem_pct], k: 5}

- id: P1
  categoria: Popularidade e engajamento
  pergunta: Os 5 filmes mais populares
  sql_ouro: |-
    SELECT d.titulo, d.ano_lancamento, ROUND(f.popularidade, 2) AS popularidade
    FROM fact_movies_performance f
    JOIN dim_movies d ON d.sk_movie_id = f.sk_movie_id
    WHERE COALESCE(f.qtd_tmdb, 0) + COALESCE(f.qtd_imdb, 0) >= 50
    ORDER BY f.popularidade DESC
    LIMIT 5
  comparar: {colunas: [titulo, popularidade], k: 5}

- id: P2
  categoria: Popularidade e engajamento
  pergunta: Filmes com maior divergência entre a nota TMDB e a nota IMDb
  sql_ouro: |-
    SELECT d.titulo, d.ano_lancamento, f.nota_tmdb, f.nota_imdb,
           ROUND(ABS(f.nota_tmdb - f.nota_imdb), 2) AS diferenca
    FROM fact_movies_performance f
    JOIN dim_movies d ON d.sk_movie_id = f.sk_movie_id
    WHERE f.nota_tmdb > 0 AND f.nota_imdb IS NOT NULL AND f.qtd_tmdb >= 50 AND f.qtd_imdb >= 50
    ORDER BY diferenca DESC
    LIMIT 10
  comparar: {colunas: [titulo, diferenca], k: 5}

- id: P3
  categoria: Popularidade e engajamento
  pergunta: Nota média IMDb por ano de lançamento
  sql_ouro: |-
    SELECT d.ano_lancamento, COUNT(*) AS filmes, ROUND(AVG(f.nota_imdb), 2) AS nota_media_imdb
    FROM fact_movies_performance f
    JOIN dim_movies d ON d.sk_movie_id = f.sk_movie_id
    WHERE f.nota_imdb IS NOT NULL
    GROUP BY d.ano_lancamento
    ORDER BY d.ano_lancamento
  comparar: {colunas: [ano_lancamento, nota_media_imdb], k: 0}

- id: E1
  categoria: Elenco e equipe
  pergunta: Ator com mais participações em filmes lançados nos últimos 5 anos
  sql_ouro: |-
    SELECT p.nome_pessoa, COUNT(DISTINCT d.sk_movie_id) AS filmes
    FROM dim_people p
    JOIN bridge_movie_person bp ON bp.sk_person_id = p.sk_person_id
    JOIN dim_movies d ON d.sk_movie_id = bp.sk_movie_id
    WHERE p.tipo_pessoa = 'Ator' AND d.status_filme = 'Lançado'
      AND d.ano_lancamento BETWEEN CAST(strftime('%Y', 'now') AS INTEGER) - 4
                               AND CAST(strftime('%Y', 'now') AS INTEGER)
    GROUP BY p.sk_person_id
    ORDER BY filmes DESC
    LIMIT 5
  comparar: {colunas: [nome_pessoa, filmes], k: 1}

- id: E2
  categoria: Elenco e equipe
  pergunta: Diretores com maior nota média (mínimo de 5 filmes)
  sql_ouro: |-
    SELECT p.nome_pessoa, COUNT(DISTINCT f.sk_movie_id) AS filmes,
           ROUND(AVG(f.nota_imdb), 2) AS nota_media_imdb
    FROM dim_people p
    JOIN bridge_movie_person bp ON bp.sk_person_id = p.sk_person_id
    JOIN fact_movies_performance f ON f.sk_movie_id = bp.sk_movie_id
    WHERE p.tipo_pessoa = 'Diretor' AND f.nota_imdb IS NOT NULL
    GROUP BY p.sk_person_id
    HAVING COUNT(DISTINCT f.sk_movie_id) >= 5
    ORDER BY nota_media_imdb DESC
    LIMIT 10
  comparar: {colunas: [nome_pessoa, nota_media_imdb], k: 5}

- id: E3
  categoria: Elenco e equipe
  pergunta: Dupla ator–diretor que mais trabalhou junta
  sql_ouro: |-
    SELECT a.nome_pessoa AS ator, dr.nome_pessoa AS diretor,
           COUNT(DISTINCT ba.sk_movie_id) AS filmes_juntos
    FROM bridge_movie_person ba
    JOIN dim_people a ON a.sk_person_id = ba.sk_person_id AND a.tipo_pessoa = 'Ator'
    JOIN bridge_movie_person bd ON bd.sk_movie_id = ba.sk_movie_id
    JOIN dim_people dr ON dr.sk_person_id = bd.sk_person_id AND dr.tipo_pessoa = 'Diretor'
    WHERE a.nome_pessoa <> dr.nome_pessoa
    GROUP BY a.sk_person_id, dr.sk_person_id
    ORDER BY filmes_juntos DESC
    LIMIT 5
  comparar: {colunas: [ator, diretor, filmes_juntos], k: 1}

- id: G1
  categoria: Gêneros e produtoras
  pergunta: Quantidade de filmes por gênero
  sql_ouro: |-
    SELECT g.nome_genero, COUNT(DISTINCT bg.sk_movie_id) AS filmes
    FROM dim_genres g
    JOIN bridge_movie_genre bg ON bg.sk_genre_id = g.sk_genre_id
    GROUP BY g.nome_genero
    ORDER BY filmes DESC
  comparar: {colunas: [nome_genero, filmes], k: 0}

- id: G2
  categoria: Gêneros e produtoras
  pergunta: Produtora com maior lucro total
  sql_ouro: |-
    SELECT c.nome_produtora, COUNT(*) AS filmes, ROUND(SUM(f.lucro_brl), 2) AS lucro_total_brl
    FROM fact_movies_performance f
    JOIN bridge_movie_company bc ON bc.sk_movie_id = f.sk_movie_id
    JOIN dim_companies c ON c.sk_company_id = bc.sk_company_id
    WHERE f.receita_brl IS NOT NULL
    GROUP BY c.sk_company_id
    ORDER BY lucro_total_brl DESC
    LIMIT 5
  comparar: {colunas: [nome_produtora, lucro_total_brl], k: 1}

- id: G3
  categoria: Gêneros e produtoras
  pergunta: Gênero com maior margem de lucro média
  sql_ouro: |-
    SELECT g.nome_genero, COUNT(*) AS filmes,
           ROUND(100.0 * SUM(f.lucro_brl) / SUM(f.receita_brl), 2) AS margem_pct
    FROM fact_movies_performance f
    JOIN bridge_movie_genre bg ON bg.sk_movie_id = f.sk_movie_id
    JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
    WHERE f.receita_brl >= 10000 AND f.orcamento_brl >= 10000
    GROUP BY g.nome_genero
    ORDER BY margem_pct DESC
  comparar: {colunas: [nome_genero, margem_pct], k: 1}

- id: A1
  categoria: Avaliações dos usuários
  pergunta: Filmes mais avaliados pelos usuários
  sql_ouro: |-
    SELECT COUNT(*) AS avaliacoes, d.titulo, d.ano_lancamento
    FROM movie_reviews r
    JOIN dim_movies d ON d.sk_movie_id = r.sk_movie_id
    GROUP BY d.sk_movie_id
    ORDER BY avaliacoes DESC
    LIMIT 10
  comparar: {modo: metrica, colunas: [avaliacoes], k: 5}

- id: A2
  categoria: Avaliações dos usuários
  pergunta: Filmes em que a nota média dos usuários mais diverge da nota IMDb
  sql_ouro: |-
    SELECT d.titulo, d.ano_lancamento, COUNT(*) AS avaliacoes,
           ROUND(AVG(r.rating), 2) AS nota_usuarios, f.nota_imdb,
           ROUND(ABS(AVG(r.rating) - f.nota_imdb), 2) AS diferenca
    FROM movie_reviews r
    JOIN dim_movies d ON d.sk_movie_id = r.sk_movie_id
    JOIN fact_movies_performance f ON f.sk_movie_id = r.sk_movie_id
    WHERE f.nota_imdb IS NOT NULL AND f.qtd_imdb >= 50
    GROUP BY d.sk_movie_id
    HAVING COUNT(*) >= 3
    ORDER BY diferenca DESC
    LIMIT 10
  comparar: {colunas: [titulo, diferenca], k: 5}

- id: X1
  categoria: Perguntas próprias
  pergunta: Quantos filmes de terror foram lançados em 2023?
  sql_ouro: |-
    SELECT COUNT(DISTINCT d.sk_movie_id) AS filmes
    FROM dim_movies d
    JOIN bridge_movie_genre bg ON bg.sk_movie_id = d.sk_movie_id
    JOIN dim_genres g ON g.sk_genre_id = bg.sk_genre_id
    WHERE g.nome_genero = 'Horror' AND d.ano_lancamento = 2023
  comparar: {colunas: [filmes], k: 1}

- id: X2
  categoria: Perguntas próprias
  pergunta: Qual a receita total dos filmes da Marvel Studios?
  sql_ouro: |-
    SELECT ROUND(SUM(f.receita_brl), 2) AS receita_total_brl
    FROM dim_companies c
    JOIN bridge_movie_company bc ON bc.sk_company_id = c.sk_company_id
    JOIN fact_movies_performance f ON f.sk_movie_id = bc.sk_movie_id
    WHERE c.nome_produtora = 'Marvel Studios'
  comparar: {colunas: [receita_total_brl], k: 1}

