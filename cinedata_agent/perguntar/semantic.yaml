  Documentary: {pt: Documentário, termos: [documentario, documentarios]}
  Drama: {pt: Drama, termos: [drama, dramas]}
  Family: {pt: Família, termos: [familia, infantil, infantis]}
  Fantasy: {pt: Fantasia, termos: [fantasia]}
  History: {pt: História, termos: [historia, historico, historicos]}
  Horror: {pt: Terror, termos: [terror, horror]}
  Music: {pt: Música, termos: [musica, musical, musicais]}
